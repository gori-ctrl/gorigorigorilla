function getCategoryExercises(category, customExercises) {
  const custom = (customExercises && customExercises[category.key]) || [];
  return [...category.exercises, ...custom];
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function dateStrOffset(offsetDays) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function TrophyIcon({ size = 16 }) {

      <path d="M18 5h2.4c0 2.5-1.4 4.3-3.2 4.7" stroke={ACCENT} strokeWidth="1.6" strokeLinecap="round" fill="none" />

function RestTimer() {
  const PRESETS = [15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 210, 240, 270, 300];
  const [duration, setDuration] = useState(90);
  const [remaining, setRemaining] = useState(90);
  const [running, setRunning] = useState(false);
  const [justFinished, setJustFinished] = useState(false);
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );
  const [pipActive, setPipActive] = useState(false);
  const [pipSupported, setPipSupported] = useState(false);

  const endAtRef = useRef(null);
  const notifTimeoutRef = useRef(null);
  const canvasRef = useRef(null);
  const videoRef = useRef(null);

  useEffect(() => {
    setPipSupported(
      !!document.pictureInPictureEnabled ||
      !!(videoRef.current && videoRef.current.webkitSupportsPresentationMode && videoRef.current.webkitSupportsPresentationMode("picture-in-picture"))
    );
  }, []);

  function clearNotifTimeout() {
    if (notifTimeoutRef.current) {
      clearTimeout(notifTimeoutRef.current);
      notifTimeoutRef.current = null;
    }
  }

  function fireNotification() {
    if (notifPermission !== "granted") return;
    const opts = {
      body: "次のセットを始めましょう💪",
      icon: "./icon-192.png",
      badge: "./icon-192.png",
      vibrate: [250, 120, 250, 120, 250],
      tag: "rest-timer",
      renotify: true,
    };
    const show = (reg) => {
      if (reg && reg.showNotification) {
        reg.showNotification("⏱ 休憩終了！", opts);
      } else {
        try { new Notification("⏱ 休憩終了！", opts); } catch (e) {}
      }
    };
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(show).catch(() => show(null));
    } else {
      show(null);
    }
  }

  function scheduleNotification(seconds) {
    clearNotifTimeout();
    if (notifPermission !== "granted") return;
    notifTimeoutRef.current = setTimeout(fireNotification, seconds * 1000);
  }

  async function requestNotifPermission() {
    if (typeof Notification === "undefined") return;
    try {
      const perm = await Notification.requestPermission();
      setNotifPermission(perm);
    } catch (e) {}
  }

  useEffect(() => {
    if (!running) return;
    const tick = () => {
      const left = Math.max(0, Math.round((endAtRef.current - Date.now()) / 1000));
      setRemaining(left);
      if (left <= 0) {
        setRunning(false);
        setJustFinished(true);
        if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]);
      }
    };
    tick();
    const id = setInterval(tick, 1000);
    const onVisible = () => { if (document.visibilityState === "visible") tick(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, [running]);

  useEffect(() => () => clearNotifTimeout(), []);

  function selectDuration(sec) {
    setDuration(sec);
    setRemaining(sec);
    setRunning(false);
    setJustFinished(false);
    clearNotifTimeout();
  }

  function toggle() {
    setJustFinished(false);
    if (remaining <= 0) {
      endAtRef.current = Date.now() + duration * 1000;
      setRemaining(duration);
      setRunning(true);
      scheduleNotification(duration);
    } else if (running) {
      setRunning(false);
      clearNotifTimeout();
    } else {
      endAtRef.current = Date.now() + remaining * 1000;
      setRunning(true);
      scheduleNotification(remaining);
    }
  }

  function reset() {
    setRunning(false);
    setJustFinished(false);
    setRemaining(duration);
    clearNotifTimeout();
  }

  function drawPipFrame(sec, dur, finished) {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0A0A0A";
    ctx.fillRect(0, 0, w, h);
    const mm = String(Math.floor(sec / 60)).padStart(2, "0");
    const ss = String(sec % 60).padStart(2, "0");
    ctx.fillStyle = finished ? "#E8352B" : "#F5F5F5";
    ctx.font = "bold 120px 'Oswald', 'Arial', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`${mm}:${ss}`, w / 2, h / 2 - 16);
    ctx.font = "bold 30px 'Oswald', 'Arial', sans-serif";
    ctx.fillStyle = "#A8A8A8";
    ctx.fillText(finished ? "休憩終了！" : "休憩中", w / 2, h / 2 + 90);
    const pct = dur > 0 ? Math.max(0, Math.min(1, sec / dur)) : 0;
    ctx.fillStyle = "#242424";
    ctx.fillRect(40, h - 44, w - 80, 14);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(40, h - 44, (w - 80) * pct, 14);
  }

  useEffect(() => {
    drawPipFrame(remaining, duration, justFinished);
  }, [remaining, duration, justFinished]);

  function startPip() {
    // IMPORTANT: iOS Safari requires requestPictureInPicture() to be called
    // synchronously within the user-gesture (tap) handler. Awaiting video.play()
    // first (even via a microtask) can cause Safari to no longer treat the call
    // as user-activated, throwing "The request is not triggered by a user
    // activation." So everything here runs synchronously, with no await/then
    // in between the tap and the PiP request.
    const canvas = canvasRef.current;
    const video = videoRef.current;
    if (!canvas || !video) return;

    if (!document.pictureInPictureEnabled && !video.webkitSupportsPresentationMode) {
      window.alert("この端末・ブラウザはピクチャーインピクチャー表示に対応していません。");
      return;
    }

    try {
      drawPipFrame(remaining, duration, justFinished);
      if (!video.srcObject) {
        const stream = canvas.captureStream(2);
        video.srcObject = stream;
      }

      // Fire-and-forget: do not await this promise before requesting PiP.
      video.play().catch(() => {});

      if (video.requestPictureInPicture) {
        video
          .requestPictureInPicture()
          .then(() => setPipActive(true))
          .catch((err) => {
            window.alert("ピクチャーインピクチャーを開始できませんでした: " + (err && err.message ? err.message : err));
          });
      } else if (video.webkitSetPresentationMode) {
        video.webkitSetPresentationMode("picture-in-picture");
        setPipActive(true);
      } else {
        window.alert("この端末・ブラウザはピクチャーインピクチャー表示に対応していません。");
      }
    } catch (e) {
      window.alert("この端末ではピクチャーインピクチャー表示を開始できませんでした: " + (e && e.message ? e.message : e));
    }
  }

  function stopPip() {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(() => {});
    } else if (videoRef.current && videoRef.current.webkitSetPresentationMode) {
      videoRef.current.webkitSetPresentationMode("inline");
    }
    setPipActive(false);
  }

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    const onLeave = () => setPipActive(false);
    video.addEventListener("leavepictureinpicture", onLeave);
    video.addEventListener("webkitpresentationmodechanged", () => {
      if (video.webkitPresentationMode !== "picture-in-picture") setPipActive(false);
    });
    return () => video.removeEventListener("leavepictureinpicture", onLeave);
  }, []);

  function labelFor(sec) {
    if (sec < 60) return `${sec}秒`;
    return sec % 60 === 0 ? `${sec / 60}分` : `${Math.floor(sec / 60)}分${sec % 60}秒`;
  }

  const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
  const ss = String(remaining % 60).padStart(2, "0");
  const pct = duration > 0 ? (remaining / duration) * 100 : 0;

  return (
    <div
      className={justFinished ? "timer-alert-box" : ""}
      style={{
        background: "#0A0A0A", border: justFinished ? `2px solid ${ACCENT}` : running ? `1px solid ${ACCENT}` : "1px solid #363636",
        borderRadius: 14, padding: "16px 16px 14px", marginBottom: 14,
      }}
    >
      {/*
        iOS Safari does not paint (and therefore does not feed captureStream())
        an element that is display:none, even though its 2D bitmap technically
        still exists. Both the canvas and the video must stay laid-out and
        visible-ish (just moved off-screen) or the PiP window shows a frozen
        black frame.
      */}
      <canvas
        ref={canvasRef}
        width={640}
        height={360}
        style={{ position: "fixed", width: 640, height: 360, opacity: 0.01, pointerEvents: "none", top: -9999, left: -9999 }}
      />
      <video
        ref={videoRef}
        muted
        playsInline
        autoPlay
        width={240}
        height={135}
        style={{ position: "fixed", width: 240, height: 135, opacity: 0.01, pointerEvents: "none", top: -9999, left: -9999 }}
      />

      <p style={{
        fontSize: 11, fontWeight: 700, margin: "0 0 12px", color: justFinished ? ACCENT : "#A8A8A8",
        fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.06em", textAlign: "center",
      }}>
        {justFinished ? "🔔 休憩終了！次のセットへ" : "休憩タイマー"}
      </p>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 14 }}>
        <span
          className={justFinished ? "timer-alert-text" : ""}
          style={{
            fontSize: 44, fontWeight: 700, color: justFinished ? ACCENT : "#F5F5F5",
            fontFamily: "'Oswald', sans-serif", lineHeight: 1, letterSpacing: "0.02em",
          }}
        >
          {mm}:{ss}
        </span>
        <div style={{ width: "100%", height: 6, background: "#242424", borderRadius: 999, overflow: "hidden", marginTop: 12 }}>
          <div style={{ height: "100%", width: `${pct}%`, background: ACCENT, borderRadius: 999, transition: "width 1s linear" }} />
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4, marginBottom: 14 }}>
        {PRESETS.map((sec) => (
          <button
            key={sec}
            onClick={() => selectDuration(sec)}
            style={{
              flexShrink: 0, fontSize: 11, padding: "5px 11px", borderRadius: 999,
              border: duration === sec ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: duration === sec ? "rgba(232,53,43,0.14)" : "transparent",
              color: duration === sec ? ACCENT : "#A8A8A8", fontWeight: 600, cursor: "pointer",
            }}
          >
            {labelFor(sec)}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, justifyContent: "center", alignItems: "center", marginBottom: 10 }}>
        <button
          onClick={toggle}
          style={{
            flex: 1, maxWidth: 220, padding: "12px 0", borderRadius: 10, border: "none",
            background: ACCENT, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer",
            fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.03em",
          }}
        >
          {running ? "一時停止" : remaining <= 0 ? "開始" : "再開"}
        </button>
        <button
          onClick={reset}
          style={{
            padding: "12px 16px", borderRadius: 10, border: "1px solid #363636", background: "transparent",
            color: "#A8A8A8", fontSize: 12, fontWeight: 600, cursor: "pointer",
          }}
        >
          リセット
        </button>
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        {notifPermission !== "granted" && notifPermission !== "unsupported" && (
          <button
            onClick={requestNotifPermission}
            style={{
              flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent",
              color: "#A8A8A8", fontSize: 11, fontWeight: 600, cursor: "pointer",
            }}
          >
            🔔 終了を通知で知らせる
          </button>
        )}
        {pipSupported && (
          <button
            onClick={pipActive ? stopPip : startPip}
            style={{
              flex: 1, padding: "9px 0", borderRadius: 8,
              border: pipActive ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: pipActive ? "rgba(232,53,43,0.12)" : "transparent",
              color: pipActive ? ACCENT : "#A8A8A8", fontSize: 11, fontWeight: 600, cursor: "pointer",
            }}
          >
            {pipActive ? "⏹ 小窓表示を終了" : "🗗 画面に浮かせて表示"}
          </button>
        )}
      </div>
      {notifPermission === "denied" && (
        <p style={{ fontSize: 10, color: "#7A7A7A", margin: "8px 0 0" }}>
          通知がブロックされています。端末の設定アプリからこのアプリの通知を許可してください。
        </p>
      )}
    </div>
  );
}

const BODYWEIGHT_EXERCISES = new Set([
  "プッシュアップ", "パイクプッシュアップ", "ナローグリッププッシュアップ",
  "懸垂", "ディップス(大胸筋)", "ディップス(三頭筋)", "インバーテッドロウ",
  "ランジ", "カーフレイズ", "ブルガリアンスプリットスクワット", "ステップアップ",
  "クランチ", "レッグレイズ", "プランク", "サイドプランク", "ロシアンツイスト",
  "バードドッグ", "デッドバグ", "ドラゴンフラッグ", "ハンギングレッグレイズ",
  "グルートブリッジ", "ドンキーキック", "サイドライングクラム",
]);

function SetPicker({ exerciseName, entries, routineInfo, note, onSaveNote, suppressTimer, onCancel, onSkip, onSave, customBodyweightNames }) {
  const [sets, setSets] = useState([{ weight: "", reps: "", bodyweight: false }]);
  const [error, setError] = useState("");
  const [noteEditing, setNoteEditing] = useState(false);
  const [noteDraft, setNoteDraft] = useState(note || "");
  const supportsBodyweight = BODYWEIGHT_EXERCISES.has(exerciseName) || (customBodyweightNames || []).includes(exerciseName);

  function handleSaveNote() {
    onSaveNote(exerciseName, noteDraft.trim());
    setNoteEditing(false);
  }

  const lastEntry = useMemo(() => {
    const past = entries
      .filter((e) => e.exerciseName === exerciseName)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id > a.id ? 1 : -1)));
    return past[0] || null;
  }, [entries, exerciseName]);

  function applyLastEntry() {
    setSets(lastEntry.sets.map((s) => ({
      weight: s.bodyweight ? "" : String(s.weight),
      reps: String(s.reps),
      bodyweight: !!s.bodyweight,
    })));
  }

  function updateSet(idx, field, value) {
    const next = sets.map((s, i) => (i === idx ? { ...s, [field]: value } : s));
    setSets(next);
  }

  function toggleBodyweight(idx) {
    const next = sets.map((s, i) => (i === idx ? { ...s, bodyweight: !s.bodyweight, weight: "" } : s));
    setSets(next);
  }

  function addSetRow() {
    setSets([...sets, { weight: "", reps: "", bodyweight: sets[sets.length - 1]?.bodyweight || false }]);
  }

  function removeSetRow(idx) {
    setSets(sets.filter((_, i) => i !== idx));
  }

  function handleSave() {
    const parsed = sets
      .map((s) => ({
        weight: s.bodyweight ? 0 : parseFloat(s.weight),
        reps: parseInt(s.reps, 10),
        bodyweight: !!s.bodyweight,
      }))
      .filter((s) => !isNaN(s.reps) && s.reps > 0 && (s.bodyweight || (!isNaN(s.weight) && s.weight > 0)));
    if (parsed.length === 0) {
      setError("重量(または自重)と回数を1セット以上入力してください");
      return;
    }
    onSave(parsed);
  }

  return (
    <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px", marginTop: 8 }}>
      {routineInfo && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ fontSize: 11, color: ACCENT, fontWeight: 700, background: "rgba(232,53,43,0.12)", border: `1px solid ${ACCENT}`, borderRadius: 999, padding: "3px 10px" }}>
            {routineInfo.name} {routineInfo.index + 1}/{routineInfo.total}
          </span>
          {onSkip && (
            <button onClick={onSkip} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>次の種目へスキップ</button>
          )}
        </div>
      )}
      <p style={{ fontSize: 15, fontWeight: 700, margin: "0 0 14px", color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.02em" }}>
        {exerciseName}
      </p>

      {noteEditing ? (
        <div style={{ marginBottom: 12 }}>
          <textarea
            value={noteDraft}
            onChange={(e) => setNoteDraft(e.target.value)}
            placeholder="フォームのコツや注意点をメモ(例: 肩甲骨を寄せる、膝がつま先より前に出ないように)"
            rows={3}
            style={{
              width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #363636",
              background: "#0A0A0A", color: "#F5F5F5", fontSize: 12, resize: "vertical", marginBottom: 8,
            }}
          />
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => { setNoteDraft(note || ""); setNoteEditing(false); }}
              style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 11, fontWeight: 600, cursor: "pointer" }}
            >
              キャンセル
            </button>
            <button
              onClick={handleSaveNote}
              style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: ACCENT, color: "#fff", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}
            >
              メモを保存
            </button>
          </div>
        </div>
      ) : note ? (
        <div style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
            <p style={{ fontSize: 12, color: "#D6D6D6", margin: 0, whiteSpace: "pre-wrap", lineHeight: 1.5 }}>📝 {note}</p>
            <button onClick={() => setNoteEditing(true)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer", flexShrink: 0 }}>編集</button>
          </div>
        </div>
      ) : (
        <button
          onClick={() => setNoteEditing(true)}
          style={{
            width: "100%", textAlign: "left", padding: "9px 12px", borderRadius: 8, border: "1px dashed #4A4A4A",
            background: "transparent", color: "#7A7A7A", fontSize: 12, cursor: "pointer", marginBottom: 12,
          }}
        >
          📝 種目メモを追加(フォームのコツなど)
        </button>
      )}

      {suppressTimer ? (
        <p style={{ fontSize: 11, color: "#A8A8A8", background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
          サーキット中は休憩なしで次の種目に進みます。1周終わったら休憩を挟めます。
        </p>
      ) : (
        <RestTimer />
      )}
      {lastEntry && (
        <button
          onClick={applyLastEntry}
          style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "9px 0", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A",
            color: "#D6D6D6", fontSize: 12, fontWeight: 600, cursor: "pointer", marginBottom: 12,
          }}
        >
          <span style={{ color: ACCENT }}>↻</span> 前回と同じ内容を入力
          <span style={{ color: "#7A7A7A" }}>
            ({lastEntry.sets.map((s) => s.bodyweight ? "自重" : `${s.weight}kg`).join(" / ")})
          </span>
        </button>
      )}
      {sets.map((s, idx) => (
        <div key={idx} style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 10px 10px 12px", marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: "#A8A8A8", fontWeight: 600 }}>{idx + 1}セット目</span>
            {sets.length > 1 && (
              <button onClick={() => removeSetRow(idx)} aria-label="このセットを削除" style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 16, cursor: "pointer", padding: "0 2px", lineHeight: 1 }}>×</button>
            )}
          </div>

          {supportsBodyweight && (
            <div style={{ display: "flex", borderRadius: 8, border: "1px solid #363636", overflow: "hidden", marginBottom: 8 }}>
              <button
                onClick={() => s.bodyweight && toggleBodyweight(idx)}
                style={{
                  flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
                  background: s.bodyweight ? "transparent" : ACCENT,
                  color: s.bodyweight ? "#A8A8A8" : "#fff",
                  fontSize: 12, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
                }}
              >
                重量
              </button>
              <button
                onClick={() => !s.bodyweight && toggleBodyweight(idx)}
                style={{
                  flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
                  background: s.bodyweight ? ACCENT : "transparent",
                  color: s.bodyweight ? "#fff" : "#A8A8A8",
                  fontSize: 12, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
                }}
              >
                自重
              </button>
            </div>
          )}

          <div style={{ display: "flex", gap: 8 }}>
            {!s.bodyweight && (
              <input
                type="number" inputMode="decimal" placeholder="重量kg" value={s.weight}
                onChange={(e) => updateSet(idx, "weight", e.target.value)}
                style={{ flex: 1, padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 13 }}
              />
            )}
            <input
              type="number" inputMode="numeric" placeholder="回数" value={s.reps}
              onChange={(e) => updateSet(idx, "reps", e.target.value)}
              style={{ flex: 1, padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 13 }}
            />
          </div>
        </div>
      ))}
      <button
        onClick={addSetRow}
        style={{ fontSize: 12, color: ACCENT, background: "transparent", border: "1px dashed #6B332F", borderRadius: 8, padding: "7px 0", width: "100%", cursor: "pointer", marginBottom: 12, fontWeight: 600 }}
      >
        + セットを追加
      </button>
      {error && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 10px" }}>{error}</p>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          キャンセル
        </button>
        <button onClick={handleSave} style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "none", background: ACCENT, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
          記録する
        </button>
      </div>
    </div>
  );
}

function EditSetsForm({ entry, onSave, onCancel, customBodyweightNames }) {
  const [sets, setSets] = useState(
    entry.sets.map((s) => ({
      weight: s.bodyweight ? "" : String(s.weight),
      reps: String(s.reps),
      bodyweight: !!s.bodyweight,
    }))
  );
  const [error, setError] = useState("");
  const supportsBodyweight = BODYWEIGHT_EXERCISES.has(entry.exerciseName) || (customBodyweightNames || []).includes(entry.exerciseName);

  function updateSet(idx, field, value) {
    setSets(sets.map((s, i) => (i === idx ? { ...s, [field]: value } : s)));
  }

  function toggleBodyweight(idx) {
    setSets(sets.map((s, i) => (i === idx ? { ...s, bodyweight: !s.bodyweight, weight: "" } : s)));
  }

  function addSetRow() {
    setSets([...sets, { weight: "", reps: "", bodyweight: sets[sets.length - 1]?.bodyweight || false }]);
  }

  function removeSetRow(idx) {
    setSets(sets.filter((_, i) => i !== idx));
  }

  function handleSave() {
    const parsed = sets
      .map((s) => ({
        weight: s.bodyweight ? 0 : parseFloat(s.weight),
        reps: parseInt(s.reps, 10),
        bodyweight: !!s.bodyweight,
      }))
      .filter((s) => !isNaN(s.reps) && s.reps > 0 && (s.bodyweight || (!isNaN(s.weight) && s.weight > 0)));
    if (parsed.length === 0) {
      setError("重量(または自重)と回数を1セット以上入力してください");
      return;
    }
    onSave(parsed);

  return (
    <div style={{ background: "#161616", border: `1px solid ${ACCENT}`, borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
          {entry.exerciseName}を編集

        <span style={{ fontSize: 11, color: "#A8A8A8" }}>{entry.date}</span>
      </div>

      {sets.map((s, idx) => (
        <div key={idx} style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 10px 10px 12px", marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: "#A8A8A8", fontWeight: 600 }}>{idx + 1}セット目</span>
            {sets.length > 1 && (
              <button onClick={() => removeSetRow(idx)} aria-label="このセットを削除" style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 16, cursor: "pointer", padding: "0 2px", lineHeight: 1 }}>×</button>
            )}

          {supportsBodyweight && (

                  flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
                  background: s.bodyweight ? "transparent" : ACCENT,
                  color: s.bodyweight ? "#A8A8A8" : "#fff",
                  fontSize: 12, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
                }}
              >
                重量
              </button>
              <button
                onClick={() => !s.bodyweight && toggleBodyweight(idx)}
                style={{
                  flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
                  background: s.bodyweight ? ACCENT : "transparent",
                  color: s.bodyweight ? "#fff" : "#A8A8A8",
                  fontSize: 12, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
                }}
              >
                自重
              </button>
            </div>

          <div style={{ display: "flex", gap: 8 }}>

              />
            )}
            <input
              type="number" inputMode="numeric" placeholder="回数" value={s.reps}
              onChange={(e) => updateSet(idx, "reps", e.target.value)}
              style={{ flex: 1, padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 13 }}
            />
          </div>
        </div>
      ))}
      <button
        onClick={addSetRow}
        style={{ fontSize: 12, color: ACCENT, background: "transparent", border: "1px dashed #6B332F", borderRadius: 8, padding: "7px 0", width: "100%", cursor: "pointer", marginBottom: 12, fontWeight: 600 }}

        + セットを追加
      </button>
      {error && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 10px" }}>{error}</p>}

function ExercisePicker({ onSelect, onClose, customExercises, onAddCustom, onDeleteCustom, favorites, onToggleFavorite }) {
  const [activeCategory, setActiveCategory] = useState(CATEGORIES[0].key);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newBodyweight, setNewBodyweight] = useState(false);
  const [formError, setFormError] = useState("");
  const category = CATEGORIES.find((c) => c.key === activeCategory);
  const customList = (customExercises && customExercises[category.key]) || [];

  function openAddForm() {
    setAdding(true);
    setNewName("");
    setNewBodyweight(false);
    setFormError("");
  }

  function handleAdd() {
    const trimmed = newName.trim();
    if (!trimmed) {
      setFormError("種目名を入力してください");
      return;
    }
    const allNames = getCategoryExercises(category, customExercises).map((n) => n.toLowerCase());
    if (allNames.includes(trimmed.toLowerCase())) {
      setFormError("同じ名前の種目がすでにあります");
      return;
    }
    onAddCustom(category.key, trimmed, newBodyweight);
    setAdding(false);
    setNewName("");
    setNewBodyweight(false);
    setFormError("");
  }

  return (
    <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px", marginTop: 8 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>種目を選ぶ</p>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 13, cursor: "pointer" }}>閉じる</button>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
        {CATEGORIES.map((c) => (
          <button
            key={c.key}
            onClick={() => { setActiveCategory(c.key); setAdding(false); }}
            style={{
              flexShrink: 0, fontSize: 12, padding: "6px 14px", borderRadius: 999,
              border: activeCategory === c.key ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: activeCategory === c.key ? "rgba(232,53,43,0.12)" : "transparent",
              color: activeCategory === c.key ? ACCENT : "#A8A8A8",
              fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
            }}
          >
            {c.label}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto", paddingRight: 2, marginBottom: 12 }}>
        {[...category.exercises]
          .sort((a, b) => (favorites.includes(b) ? 1 : 0) - (favorites.includes(a) ? 1 : 0))
          .map((ex) => {
            const isFav = favorites.includes(ex);
            return (
              <div key={ex} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <button
                  onClick={() => onSelect(ex, category.key)}
                  style={{
                    flex: 1, padding: "11px 12px", borderRadius: 10,
                    border: isFav ? `1px solid ${ACCENT}` : "1px solid #363636",
                    background: isFav ? "rgba(232,53,43,0.06)" : "#0A0A0A",
                    color: "#F5F5F5", fontSize: 13, fontWeight: 500, cursor: "pointer", textAlign: "left",
                  }}
                >
                  {ex}
                </button>
                <button
                  onClick={() => onToggleFavorite(ex)}
                  aria-label={isFav ? `${ex}をお気に入りから外す` : `${ex}をお気に入りに登録`}
                  style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: isFav ? ACCENT : "#7A7A7A", fontSize: 15, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                >
                  {isFav ? "★" : "☆"}
                </button>
              </div>
            );
          })}
        {customList.length > 0 && (
          <p style={{ fontSize: 10, fontWeight: 700, color: "#A8A8A8", margin: "6px 0 0", textTransform: "uppercase", letterSpacing: "0.05em" }}>
            自分の種目
          </p>
        )}
        {[...customList]
          .sort((a, b) => (favorites.includes(b) ? 1 : 0) - (favorites.includes(a) ? 1 : 0))
          .map((ex) => {
            const isFav = favorites.includes(ex);
            return (
              <div key={ex} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <button
                  onClick={() => onSelect(ex, category.key)}
                  style={{
                    flex: 1, padding: "11px 12px", borderRadius: 10, border: `1px solid ${ACCENT}`, background: "rgba(232,53,43,0.08)",
                    color: "#F5F5F5", fontSize: 13, fontWeight: 500, cursor: "pointer", textAlign: "left",
                  }}
                >
                  {ex}
                </button>
                <button
                  onClick={() => onToggleFavorite(ex)}
                  aria-label={isFav ? `${ex}をお気に入りから外す` : `${ex}をお気に入りに登録`}
                  style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: isFav ? ACCENT : "#7A7A7A", fontSize: 15, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                >
                  {isFav ? "★" : "☆"}
                </button>
                <button
                  onClick={() => onDeleteCustom(category.key, ex)}
                  aria-label={`${ex}を削除`}
                  style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: "#A8A8A8", fontSize: 14, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                >
                  ×
                </button>
              </div>
            );
          })}
      </div>

      {adding ? (
        <div style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "12px" }}>
          <input
            type="text" value={newName} onChange={(e) => setNewName(e.target.value)}
            placeholder={`${category.label}のオリジナル種目名`} autoFocus
            style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 13, marginBottom: 8 }}
          />
          <button
            onClick={() => setNewBodyweight((v) => !v)}
            style={{
              display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left",
              padding: "8px 10px", borderRadius: 8, marginBottom: 10, cursor: "pointer",
              border: newBodyweight ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: newBodyweight ? "rgba(232,53,43,0.1)" : "transparent",
            }}
          >
            <span style={{
              width: 16, height: 16, borderRadius: 4, flexShrink: 0,
              border: `2px solid ${newBodyweight ? ACCENT : "#7A7A7A"}`,
              background: newBodyweight ? ACCENT : "transparent",
              display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 10, fontWeight: 700,
            }}>
              {newBodyweight ? "✓" : ""}
            </span>
            <span style={{ fontSize: 12, color: "#D6D6D6" }}>自重種目として記録する</span>
          </button>
          {formError && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 8px" }}>{formError}</p>}
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => setAdding(false)}
              style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
            >
              キャンセル
            </button>
            <button
              onClick={handleAdd}
              style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", background: ACCENT, color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}
            >
              追加する
            </button>
          </div>
        </div>
      ) : (
        <button
          onClick={openAddForm}
          style={{
            width: "100%", textAlign: "center", padding: "10px 12px", borderRadius: 10, border: "1px dashed #6B332F",
            background: "transparent", color: ACCENT, fontSize: 12, fontWeight: 700, cursor: "pointer",
            fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
          }}
        >
          + {category.label}にオリジナル種目を追加
        </button>
      )}
    </div>
  );
}

function estimated1RM(weight, reps) {
  return weight * (1 + reps / 30);
}

function ProgressChart({ entries }) {
  const exerciseNames = useMemo(() => {
    const set = new Set(entries.map((e) => e.exerciseName));
    return Array.from(set);
  }, [entries]);
  const [selected, setSelected] = useState(null);
  const [page, setPage] = useState(0);
  const [metric, setMetric] = useState("actual"); // actual | estimated1rm

  useEffect(() => {
    if (selected && !exerciseNames.includes(selected)) setSelected(null);
  }, [exerciseNames]);

  if (exerciseNames.length === 0) {
    return <p style={{ fontSize: 13, color: "#A8A8A8" }}>記録が増えると、種目ごとの重量推移がここに表示されます。</p>;
  }

  if (!selected) {
    return (
      <div>
        <p style={{ fontSize: 13, fontWeight: 600, margin: "0 0 12px", color: "#F5F5F5" }}>推移を見る種目を選んでください</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 320, overflowY: "auto", paddingRight: 2 }}>
          {exerciseNames.map((name) => (
            <button
              key={name}
              onClick={() => { setSelected(name); setPage(0); }}
              style={{
                padding: "11px 12px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A",
                color: "#F5F5F5", fontSize: 13, fontWeight: 500, cursor: "pointer", textAlign: "left",
              }}
            >
              {name}
            </button>
          ))}
        </div>
      </div>
    );
  }

  const pageSize = 8;
  const allSessions = entries
    .filter((e) => e.exerciseName === selected)
    .map((e) => {
      const weightedSets = e.sets.filter((s) => !s.bodyweight);
      const hasBodyweightSet = e.sets.some((s) => s.bodyweight);
      if (weightedSets.length > 0) {
        const value = metric === "estimated1rm"
          ? Math.max(...weightedSets.map((s) => estimated1RM(s.weight, s.reps)))
          : Math.max(...weightedSets.map((s) => s.weight));
        return { date: e.date, topWeight: Math.round(value * 10) / 10, isBodyweight: false };
      }
      if (hasBodyweightSet) {
        return { date: e.date, topWeight: 0, isBodyweight: true };
      }
      return null;
    })
    .filter(Boolean)
    .sort((a, b) => (a.date < b.date ? -1 : 1));

  const maxPage = Math.max(0, Math.ceil(allSessions.length / pageSize) - 1);
  const end = allSessions.length - pageSize * page;
  const start = Math.max(0, end - pageSize);
  const sessions = allSessions.slice(start, end);

  const width = 320;
  const height = 130;
  const padX = 10;
  const padY = 16;
  const weights = sessions.map((s) => s.topWeight);
  const maxW = weights.length ? Math.max(...weights) : 0;
  const minW = weights.length ? Math.min(0, ...weights) : 0;
  const range = maxW - minW || 10;
  const stepX = sessions.length > 1 ? (width - padX * 2) / (sessions.length - 1) : 0;

  const points = sessions.map((s, i) => {
    const x = padX + i * stepX;
    const y = padY + (1 - (s.topWeight - minW) / range) * (height - padY * 2);
    return { x, y, w: s.topWeight, isBodyweight: s.isBodyweight };
  });
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const latest = sessions[sessions.length - 1];

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>{selected}</p>
        <button onClick={() => setSelected(null)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 12, cursor: "pointer" }}>種目を変更</button>
      </div>

      <div style={{ display: "flex", borderRadius: 8, border: "1px solid #363636", overflow: "hidden", marginBottom: 12 }}>
        <button
          onClick={() => setMetric("actual")}
          style={{
            flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
            background: metric === "actual" ? ACCENT : "transparent",
            color: metric === "actual" ? "#fff" : "#A8A8A8",
            fontSize: 11, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
          }}
        >
          実測トップ重量
        </button>
        <button
          onClick={() => setMetric("estimated1rm")}
          style={{
            flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
            background: metric === "estimated1rm" ? ACCENT : "transparent",
            color: metric === "estimated1rm" ? "#fff" : "#A8A8A8",
            fontSize: 11, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
          }}
        >
          推定1RM
        </button>
      </div>

      {allSessions.length === 0 ? (
        <p style={{ fontSize: 13, color: "#A8A8A8" }}>この種目の重量記録がまだありません。</p>
      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <button
              onClick={() => setPage((p) => Math.min(maxPage, p + 1))}
              disabled={page >= maxPage}
              aria-label="過去のセッション"
              style={{ background: "transparent", border: "1px solid #363636", color: page >= maxPage ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: page >= maxPage ? "default" : "pointer" }}
            >
              ‹
            </button>
            <span style={{ fontSize: 11, color: "#7A7A7A" }}>
              {sessions.length > 0 ? `${formatDateLabel(sessions[0].date)} 〜 ${formatDateLabel(sessions[sessions.length - 1].date)}` : ""}
            </span>
            <button
              onClick={() => setPage((p) => Math.max(0, p - 1))}
              disabled={page === 0}
              aria-label="最近のセッション"
              style={{ background: "transparent", border: "1px solid #363636", color: page === 0 ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: page === 0 ? "default" : "pointer" }}
            >
              ›
            </button>
          </div>

          <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label={`${selected}の重量推移`}>
            {pathD && <path d={pathD} fill="none" stroke={ACCENT} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />}
            {points.map((p, i) =>
              p.isBodyweight ? (
                <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#161616" stroke={ACCENT} strokeWidth="2" />
              ) : (
                <circle key={i} cx={p.x} cy={p.y} r="3" fill={ACCENT} />
              )
            )}
          </svg>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#7A7A7A", marginTop: 2 }}>
            <span>{formatDateLabel(sessions[0].date)}</span>
            <span>{formatDateLabel(sessions[sessions.length - 1].date)}</span>
          </div>
          {sessions.some((s) => s.isBodyweight) && (
            <p style={{ fontSize: 10, color: "#7A7A7A", marginTop: 6 }}>◎ 自重で行ったセッション</p>
          )}
          {latest && (
            <p style={{ fontSize: 12, color: "#A8A8A8", marginTop: 8 }}>
              直近の記録: <span style={{ color: "#F5F5F5", fontWeight: 700 }}>{latest.isBodyweight ? "自重" : `${latest.topWeight}kg`}</span>
            </p>
          )}
        </>
      )}
    </div>
  );
}

function CalendarView({ entries, onDeleteEntry, onEditEntry }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedDate, setSelectedDate] = useState(todayStr());

  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + monthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const dateKeys = useMemo(() => {
    const map = {};
    entries.forEach((e) => {
      map[e.date] = (map[e.date] || 0) + 1;
    });
    return map;
  }, [entries]);

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    cells.push(key);
  }

  const weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];
  const selectedEntries = entries.filter((e) => e.date === selectedDate);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button onClick={() => setMonthOffset((m) => m - 1)} style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 30, height: 30, cursor: "pointer" }}>‹</button>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif" }}>{year}年{month + 1}月</p>
        <button onClick={() => setMonthOffset((m) => m + 1)} style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 30, height: 30, cursor: "pointer" }}>›</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 6 }}>
        {weekdayLabels.map((w) => (
          <div key={w} style={{ textAlign: "center", fontSize: 10, color: "#7A7A7A" }}>{w}</div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 16 }}>
        {cells.map((key, i) => {
          if (!key) return <div key={`empty-${i}`} />;
          const has = !!dateKeys[key];
          const isSelected = key === selectedDate;
          const isToday = key === todayStr();
          const dayNum = parseInt(key.slice(-2), 10);
          return (
            <button
              key={key}
              onClick={() => setSelectedDate(key)}
              style={{
                aspectRatio: "1", borderRadius: 8, border: isSelected ? `1px solid ${ACCENT}` : "1px solid transparent",
                background: isSelected ? "rgba(232,53,43,0.15)" : has ? "#161616" : "transparent",

              }}
            >
              <span>{dayNum}</span>
              {has && <span style={{ width: 4, height: 4, borderRadius: "50%", background: ACCENT }} />}
            </button>
          );
        })}
      </div>

      <p style={{ fontSize: 12, fontWeight: 700, margin: "0 0 10px", color: "#A8A8A8", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>

        <p style={{ fontSize: 13, color: "#7A7A7A" }}>この日の記録はありません。</p>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>

              <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
                <button onClick={() => onEditEntry(e)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>編集</button>
                <button onClick={() => onDeleteEntry(e.id)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer" }}>削除</button>
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {e.sets.map((s, i) => (
                <span key={i} style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>

  );

function formatPace(distanceKm, durationSec) {
  if (!distanceKm || distanceKm <= 0) return "—";
  const paceSec = durationSec / distanceKm;
  const m = Math.floor(paceSec / 60);
  const s = Math.round(paceSec % 60);
  const ss = s === 60 ? "00" : String(s).padStart(2, "0");
  const mm = s === 60 ? m + 1 : m;
  return `${mm}'${ss}"`;
}

function formatRunDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function computeRunDistanceSeries(runLog, range, offset) {
  const buckets = range === "week" ? 8 : 6;
  const series = [];
  if (range === "week") {
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const dow = now.getDay();
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const thisMonday = new Date(now);
    thisMonday.setDate(now.getDate() + diffToMonday);
    for (let i = buckets - 1; i >= 0; i--) {
      const start = new Date(thisMonday);
      start.setDate(thisMonday.getDate() - (offset * buckets + i) * 7);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const startKey = start.toISOString().slice(0, 10);
      const endKey = end.toISOString().slice(0, 10);
      const total = runLog.filter((r) => r.date >= startKey && r.date <= endKey).reduce((s, r) => s + r.distanceKm, 0);
      series.push({ label: `${start.getMonth() + 1}/${start.getDate()}`, total });
    }
  } else {
    const now = new Date();
    now.setDate(1);
    for (let i = buckets - 1; i >= 0; i--) {
      const d = new Date(now);
      d.setMonth(now.getMonth() - (offset * buckets + i));
      const y = d.getFullYear(), m = d.getMonth();
      const prefix = `${y}-${String(m + 1).padStart(2, "0")}`;
      const total = runLog.filter((r) => r.date.startsWith(prefix)).reduce((s, r) => s + r.distanceKm, 0);
      series.push({ label: `${m + 1}月`, total });
    }
  }
  return series;
}

function RunTab({ runLog, onAdd, onUpdate, onDelete }) {
  const [mode, setMode] = useState("idle"); // idle | logging | editing
  const [editingRun, setEditingRun] = useState(null);
  const [range, setRange] = useState("week");
  const [offset, setOffset] = useState(0);

  function changeRange(key) {
    setRange(key);
    setOffset(0);
  }

  const thisWeekStart = dateStrOffset(-6);
  const lastWeekStart = dateStrOffset(-13);
  const lastWeekEnd = dateStrOffset(-7);
  const thisMonthPrefix = todayStr().slice(0, 7);
  const thisWeekDistance = runLog.filter((r) => r.date >= thisWeekStart).reduce((s, r) => s + r.distanceKm, 0);
  const lastWeekDistance = runLog.filter((r) => r.date >= lastWeekStart && r.date <= lastWeekEnd).reduce((s, r) => s + r.distanceKm, 0);
  const thisMonthDistance = runLog.filter((r) => r.date.startsWith(thisMonthPrefix)).reduce((s, r) => s + r.distanceKm, 0);

  const series = computeRunDistanceSeries(runLog, range, offset);
  const width = 320;
  const height = 130;
  const padX = 10;
  const padY = 16;
  const totals = series.map((s) => s.total);
  const maxV = Math.max(1, ...totals);
  const stepX = series.length > 1 ? (width - padX * 2) / (series.length - 1) : 0;
  const barW = Math.max(6, (width - padX * 2) / series.length - 4);

  const sortedRuns = [...runLog].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id > a.id ? 1 : -1)));

  function handleAdd(data) {
    onAdd(data);
    setMode("idle");
  }

  function handleUpdate(data) {
    onUpdate(editingRun.id, data);
    setMode("idle");
    setEditingRun(null);
  }

  function startEdit(run) {
    setEditingRun(run);
    setMode("editing");
  }

  return (
    <div>
      {mode === "idle" && (
        <button
          onClick={() => setMode("logging")}
          style={{
            width: "100%", padding: "13px 0", borderRadius: 12, border: "1px dashed #6B332F",
            background: "transparent", color: ACCENT, fontSize: 13, fontWeight: 700,
            cursor: "pointer", marginBottom: 16, fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
          }}
        >
          🏃 ランニングを記録
        </button>
      )}

      {mode === "logging" && <RunLogForm onSave={handleAdd} onCancel={() => setMode("idle")} />}
      {mode === "editing" && editingRun && (
        <RunLogForm initial={editingRun} onSave={handleUpdate} onCancel={() => { setMode("idle"); setEditingRun(null); }} />
      )}

      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今週の合計距離</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{thisWeekDistance.toFixed(1)}<span style={{ fontSize: 11, color: "#A8A8A8" }}>km</span></p>
          <p style={{ fontSize: 11, margin: "4px 0 0", color: "#7A7A7A" }}>先週: {lastWeekDistance.toFixed(1)}km</p>
        </div>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今月の合計距離</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{thisMonthDistance.toFixed(1)}<span style={{ fontSize: 11, color: "#A8A8A8" }}>km</span></p>
        </div>
      </div>

      <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <p style={{ fontSize: 13, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>合計距離の推移</p>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ key: "week", label: "週間" }, { key: "month", label: "月間" }].map((opt) => (
              <button
                key={opt.key}
                onClick={() => changeRange(opt.key)}
                style={{
                  fontSize: 11, padding: "4px 10px", borderRadius: 999,
                  border: range === opt.key ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: range === opt.key ? "rgba(232,53,43,0.12)" : "transparent",
                  color: range === opt.key ? ACCENT : "#A8A8A8", fontWeight: 600, cursor: "pointer",
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <button
            onClick={() => setOffset((o) => o + 1)}
            aria-label="前の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: "pointer" }}
          >
            ‹
          </button>
          <span style={{ fontSize: 11, color: "#7A7A7A" }}>{series[0].label} 〜 {series[series.length - 1].label}</span>
          <button
            onClick={() => setOffset((o) => Math.max(0, o - 1))}
            disabled={offset === 0}
            aria-label="次の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: offset === 0 ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: offset === 0 ? "default" : "pointer" }}
          >
            ›
          </button>
        </div>

        <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="合計距離の推移グラフ">
          {series.map((s, i) => {
            const x = padX + i * stepX - barW / 2;
            const h = (s.total / maxV) * (height - padY * 2);
            const y = height - padY - h;
            return <rect key={i} x={x} y={y} width={barW} height={h} rx="2" fill={s.total > 0 ? ACCENT : "#242424"} />;
          })}
        </svg>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#7A7A7A", marginTop: 2 }}>
          <span>{series[0].label}</span>
          <span>{series[series.length - 1].label}</span>
        </div>
      </div>

      <p style={{ fontSize: 12, fontWeight: 700, margin: "0 0 10px", color: "#A8A8A8", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
        ランニング履歴
      </p>
      {sortedRuns.length === 0 ? (
        <p style={{ fontSize: 13, color: "#7A7A7A" }}>まだ記録がありません。</p>
      ) : (
        sortedRuns.map((r) => (
          <div key={r.id} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
              <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif" }}>{formatDateLabel(r.date)}</p>
              <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
                <button onClick={() => startEdit(r)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>編集</button>
                <button onClick={() => onDelete(r.id)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer" }}>削除</button>
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              <span style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                {r.distanceKm}km

                {formatPace(r.distanceKm, r.durationSec)}/km

            </div>
          </div>
        ))
      )}
    </div>
  );
}

            </p>

      )}
    </div>
  );
}

function computeCategoryCounts(entries, days) {
  const cutoff = dateStrOffset(-(days - 1));
  const counts = {};
  CATEGORIES.forEach((c) => { counts[c.key] = 0; });
  entries.forEach((e) => {
    if (e.date >= cutoff && counts[e.category] !== undefined) {
      counts[e.category] += 1;
    }
  });
  return counts;
}

function computeExerciseBests(entries) {
  const bests = {};
  entries.forEach((e) => {
    const weightedSets = e.sets.filter((s) => !s.bodyweight);
    if (weightedSets.length === 0) return;
    const top = Math.max(...weightedSets.map((s) => s.weight));
    if (!bests[e.exerciseName] || top > bests[e.exerciseName].weight) {
      bests[e.exerciseName] = { weight: top, date: e.date };
    }
  });
  return bests;
}

function PersonalRecords({ entries }) {
  const [expanded, setExpanded] = useState(false);
  const bests = computeExerciseBests(entries);
  const list = Object.entries(bests).sort((a, b) => b[1].weight - a[1].weight);

  if (list.length === 0) return null;
  const visible = expanded ? list : list.slice(0, 4);

    <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "14px 16px", marginBottom: 16 }}>

function RecentExercises({ entries, onDuplicate }) {
  const recent = useMemo(() => {
    const sorted = [...entries].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id > a.id ? 1 : -1)));
    const seen = new Set();
    const list = [];
    for (const e of sorted) {
      if (seen.has(e.exerciseName)) continue;
      seen.add(e.exerciseName);
      list.push(e);
      if (list.length >= 6) break;
    }
    return list;
  }, [entries]);

  if (recent.length === 0) return null;

  return (
    <div style={{ marginBottom: 16 }}>
      <p style={{ fontSize: 12, fontWeight: 700, margin: "0 0 10px", color: "#A8A8A8", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.04em" }}>

function GoalCard({ exerciseName, best, goal, onSave, onDelete, onCancelNew }) {
  const [editing, setEditing] = useState(!goal);
  const [weight, setWeight] = useState(goal ? String(goal.weight) : "");
  const [reps, setReps] = useState(goal ? String(goal.reps) : "");
  const [error, setError] = useState("");

  function handleSave() {
    setError("");
    const w = parseFloat(weight);
    const r = parseInt(reps, 10);
    if (isNaN(w) || w <= 0 || isNaN(r) || r <= 0) {
      setError("目標重量と目標回数を入力してください");
      return;
    }
    onSave(exerciseName, w, r);
    setEditing(false);
  }

  const bestWeight = best ? best.weight : 0;
  const pct = goal && goal.weight > 0 ? Math.min(100, Math.round((bestWeight / goal.weight) * 100)) : 0;
  const achieved = goal && bestWeight >= goal.weight;

  return (
    <div style={{ background: "#0A0A0A", border: achieved ? `1px solid ${ACCENT}` : "1px solid #363636", borderRadius: 12, padding: "12px 14px", marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", display: "flex", alignItems: "center", gap: 6 }}>
          {exerciseName} {achieved && <TrophyIcon size={14} />}
        </p>
        {goal && !editing && (
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => setEditing(true)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>編集</button>
            <button onClick={() => onDelete(exerciseName)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer" }}>削除</button>
          </div>
        )}
      </div>

      {!editing && goal ? (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: "#A8A8A8" }}>現在: {bestWeight}kg / 目標: {goal.weight}kg × {goal.reps}回</span>
            <span style={{ fontSize: 11, color: achieved ? ACCENT : "#A8A8A8", fontWeight: 700 }}>{pct}%</span>
          </div>
          <div style={{ height: 7, background: "#242424", borderRadius: 999, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${pct}%`, background: ACCENT, borderRadius: 999, transition: "width 0.4s ease" }} />
          </div>
          <p style={{ fontSize: 10, color: "#7A7A7A", margin: "8px 0 0" }}>月間目標として設定中(いつでも変更できます)</p>
        </>
      ) : (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              type="number" inputMode="decimal" placeholder="目標重量kg" value={weight}
              onChange={(e) => setWeight(e.target.value)}
              style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 12 }}
            />
            <input
              type="number" inputMode="numeric" placeholder="目標回数" value={reps}
              onChange={(e) => setReps(e.target.value)}
              style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 12 }}
            />
          </div>
          {error && <p style={{ color: ACCENT, fontSize: 11, margin: "0 0 8px" }}>{error}</p>}
          <div style={{ display: "flex", gap: 8 }}>
            {(goal || onCancelNew) && (
              <button
                onClick={() => (goal ? setEditing(false) : onCancelNew && onCancelNew())}
                style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 11, fontWeight: 600, cursor: "pointer" }}

                キャンセル

            )}
            <button onClick={handleSave} style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: ACCENT, color: "#fff", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>

  );

function computeEntryVolume(entry) {
  return entry.sets
    .filter((s) => !s.bodyweight)
    .reduce((sum, s) => sum + s.weight * s.reps, 0);
}

function computeDailyVolumeSeries(entries, days, offset) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  today.setDate(today.getDate() - offset * days);
  const byDate = {};
  entries.forEach((e) => {
    byDate[e.date] = (byDate[e.date] || 0) + computeEntryVolume(e);
  });
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    series.push({ date: key, label: `${d.getMonth() + 1}/${d.getDate()}`, volume: byDate[key] || 0 });
  }
  return series;
}

function AnalysisTab({ entries }) {
  const [range, setRange] = useState("week");
  const [offset, setOffset] = useState(0);
  const days = range === "week" ? 7 : 30;
  const series = computeDailyVolumeSeries(entries, days, offset);

  const thisWeekStart = dateStrOffset(-6);
  const lastWeekStart = dateStrOffset(-13);
  const lastWeekEnd = dateStrOffset(-7);
  const thisWeekVolume = entries.filter((e) => e.date >= thisWeekStart).reduce((s, e) => s + computeEntryVolume(e), 0);
  const lastWeekVolume = entries.filter((e) => e.date >= lastWeekStart && e.date <= lastWeekEnd).reduce((s, e) => s + computeEntryVolume(e), 0);
  const thisWeekDays = new Set(entries.filter((e) => e.date >= thisWeekStart).map((e) => e.date)).size;
  const volumeChangePct = lastWeekVolume > 0 ? Math.round(((thisWeekVolume - lastWeekVolume) / lastWeekVolume) * 100) : null;

  function changeRange(key) {
    setRange(key);
    setOffset(0);
  }

  const width = 320;
  const height = 130;
  const padX = 10;
  const padY = 16;
  const volumes = series.map((s) => s.volume);
  const maxV = Math.max(1, ...volumes);
  const stepX = series.length > 1 ? (width - padX * 2) / (series.length - 1) : 0;
  const barW = Math.max(3, (width - padX * 2) / series.length - 3);

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今週の総重量</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{Math.round(thisWeekVolume).toLocaleString()}<span style={{ fontSize: 11, color: "#A8A8A8" }}>kg</span></p>
          {volumeChangePct !== null && (
            <p style={{ fontSize: 11, margin: "4px 0 0", color: volumeChangePct >= 0 ? "#6FBF7A" : ACCENT, fontWeight: 700 }}>
              先週比 {volumeChangePct >= 0 ? "+" : ""}{volumeChangePct}%
            </p>
          )}
        </div>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今週のトレ日数</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{thisWeekDays}<span style={{ fontSize: 11, color: "#A8A8A8" }}>日</span></p>
          <p style={{ fontSize: 11, margin: "4px 0 0", color: "#7A7A7A" }}>先週: {Math.round(lastWeekVolume).toLocaleString()}kg</p>
        </div>
      </div>

      <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <p style={{ fontSize: 13, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>総重量の推移</p>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ key: "week", label: "週間" }, { key: "month", label: "月間" }].map((opt) => (
              <button
                key={opt.key}
                onClick={() => changeRange(opt.key)}
                style={{
                  fontSize: 11, padding: "4px 10px", borderRadius: 999,
                  border: range === opt.key ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: range === opt.key ? "rgba(232,53,43,0.12)" : "transparent",
                  color: range === opt.key ? ACCENT : "#A8A8A8", fontWeight: 600, cursor: "pointer",
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <button
            onClick={() => setOffset((o) => o + 1)}
            aria-label="前の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: "pointer" }}
          >
            ‹
          </button>
          <span style={{ fontSize: 11, color: "#7A7A7A" }}>{series[0].label} 〜 {series[series.length - 1].label}</span>
          <button
            onClick={() => setOffset((o) => Math.max(0, o - 1))}
            disabled={offset === 0}
            aria-label="次の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: offset === 0 ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: offset === 0 ? "default" : "pointer" }}
          >
            ›
          </button>
        </div>

        <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="総重量の推移グラフ">
          {series.map((s, i) => {
            const x = padX + i * stepX - barW / 2;
            const h = (s.volume / maxV) * (height - padY * 2);
            const y = height - padY - h;
            return <rect key={i} x={x} y={y} width={barW} height={h} rx="2" fill={s.volume > 0 ? ACCENT : "#242424"} />;
          })}
        </svg>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#7A7A7A", marginTop: 2 }}>
          <span>{series[0].label}</span>
          <span>{series[series.length - 1].label}</span>
        </div>
        <p style={{ fontSize: 11, color: "#7A7A7A", marginTop: 10 }}>総重量 = 重量 × 回数の合計(自重セットは含みません)</p>
      </div>
    </div>
  );
}
